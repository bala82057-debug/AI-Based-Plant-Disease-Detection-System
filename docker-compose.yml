version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plantcare_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/plantcare.db:/app/plantcare.db
      - ./backend/model:/app/model
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plantcare_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
